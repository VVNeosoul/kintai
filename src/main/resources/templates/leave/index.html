<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>休暇申請</title>
</head>
<body>
<h1>休暇申請</h1>

<p th:if="${message}" th:text="${message}"></p>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form th:action="@{/leave}" th:object="${form}" method="post">
    <div>
        <label>休暇日 <input type="date" th:field="*{leaveDate}"></label>
        <span th:if="${#fields.hasErrors('leaveDate')}" th:errors="*{leaveDate}" style="color:red;"></span>
    </div>
    <div>
        <label>理由 <input type="text" th:field="*{reason}" size="40"></label>
        <span th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}" style="color:red;"></span>
    </div>
    <button type="submit">申請する</button>
</form>

<h2>申請履歴</h2>
<table border="1" cellpadding="6">
    <thead>
    <tr><th>休暇日</th><th>理由</th><th>状態</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${records}">
        <td th:text="${#temporals.format(r.leaveDate, 'yyyy-MM-dd')}"></td>
        <td th:text="${r.reason}"></td>
        <td th:text="${r.status == 'PENDING'} ? '承認待ち' : (${r.status == 'APPROVED'} ? '承認済み' : '却下')"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(records)}">
        <td colspan="3">申請履歴がありません。</td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/}">ホームへ戻る</a></p>
</body>
</html>
