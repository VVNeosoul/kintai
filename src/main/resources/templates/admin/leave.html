<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>休暇申請の承認</title>
</head>
<body>
<h1>休暇申請の承認</h1>

<p th:if="${message}" th:text="${message}"></p>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<table border="1" cellpadding="6">
    <thead>
    <tr><th>申請者</th><th>休暇日</th><th>理由</th><th>操作</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${requests}">
        <td th:text="${r.employeeName}"></td>
        <td th:text="${#temporals.format(r.leaveDate, 'yyyy-MM-dd')}"></td>
        <td th:text="${r.reason}"></td>
        <td>
            <form th:action="@{/admin/leave/{id}/approve(id=${r.id})}" method="post" style="display:inline;">
                <button type="submit">承認</button>
            </form>
            <form th:action="@{/admin/leave/{id}/reject(id=${r.id})}" method="post" style="display:inline;">
                <button type="submit">却下</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(requests)}">
        <td colspan="4">承認待ちの申請はありません。</td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/admin}">管理者メニューへ戻る</a></p>
</body>
</html>
