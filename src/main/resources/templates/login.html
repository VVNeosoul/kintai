<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
<h1>勤怠管理システム</h1>
<form th:action="@{/login}" method="post">
    <p th:if="${param.error}">社員番号またはパスワードが正しくありません。</p>
    <p th:if="${param.logout}">ログアウトしました。</p>
    <div><label>社員番号 <input type="text" name="username" required></label></div>
    <div><label>パスワード <input type="password" name="password" required></label></div>
    <button type="submit">ログイン</button>
</form>
</body>
</html>
